# Disposable migration/ticket test database. No application volumes are mounted.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ally_auth_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: ally_auth_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ally_auth_test -d ally_auth_test"]
      interval: 2s
      timeout: 3s
      retries: 20
