services:
  # ---------- Vector / hybrid search ----------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ---------- Cache / semantic cache ----------
  redis:
    image: redis/redis-stack:latest   # includes RedisVL-compatible modules (search, json)
    container_name: redis
    ports:
      - "6379:6379"
      - "8001:8001"   # RedisInsight UI
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- Application metadata / chunk store ----------
  # Dedicated to this app's own tables (document_chunks, tenants, api_keys).
  # Deliberately NOT shared with Temporal or Langfuse below — both of
  # those run their own schema migrations against whatever database they
  # connect to, and having three independent migration systems mutate the
  # same database is a support problem waiting to happen (a Temporal or
  # Langfuse upgrade could collide with this app's own migrations, and a
  # `DROP SCHEMA` mistake during local dev debugging one service can take
  # the other two down with it).
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/001_document_chunks.sql:/docker-entrypoint-initdb.d/001_document_chunks.sql:ro
      - ./postgres/002_auth_and_tenancy.sql:/docker-entrypoint-initdb.d/002_auth_and_tenancy.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- Temporal's own metadata store ----------

  temporal-postgres:
    image: postgres:15
    container_name: temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- Langfuse's own metadata store ----------

  langfuse-postgres:
    image: postgres:16
    container_name: langfuse-postgres
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- Conversation history / similar-query cache ----------
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- Durable ingestion workflows ----------
  temporal:
    image: temporalio/auto-setup:1.25.1
    container_name: temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/docker.yaml
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z $(hostname -i) 7233 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    container_name: temporal-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal
    restart: unless-stopped

  # ---------- LLM tracing / evaluation ----------
  langfuse:
    image: langfuse/langfuse:latest
    container_name: langfuse
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      - NEXTAUTH_SECRET=changeme
      - SALT=changeme
      - NEXTAUTH_URL=http://localhost:3001
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------- App ----------
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ally-api
    user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      - ally_uploads:/tmp/ally_uploads
      - hf_cache:/home/appuser/.cache/huggingface
    environment:
      - POSTGRES_DSN=postgresql://assistant:assistant@postgres:5432/assistant_db
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017
      - TEMPORAL_ADDRESS=temporal:7233
      - UPLOAD_DIR=/tmp/ally_uploads
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/home/appuser/.cache/huggingface
      - TRANSFORMERS_CACHE=/home/appuser/.cache/huggingface/transformers
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ally-worker
    user: "1000:1000"
    command: ["python", "workflows/worker.py"]
    environment:
      - POSTGRES_DSN=postgresql://assistant:assistant@postgres:5432/assistant_db
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017
      - TEMPORAL_ADDRESS=temporal:7233
      - UPLOAD_DIR=/tmp/ally_uploads
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/home/appuser/.cache/huggingface
      - TRANSFORMERS_CACHE=/home/appuser/.cache/huggingface/transformers
    volumes:
      - ally_uploads:/tmp/ally_uploads
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  postgres_data:
  temporal_postgres_data:
  langfuse_postgres_data:
  mongo_data:
  ally_uploads:
  hf_cache: